timeline:
  eyebrow: The order that matters
  title: Migrate workloads off a component before you remove it
  items:
    - date: Prepare
      title: Pre-flight, baseline, assess
      desc: Confirm prerequisites, take a verified backup, record what works today, and run the rhai-cli assessment.
    - date: Before upgrade
      title: Convert, remediate, stop workbenches
      desc: Move models to RawDeployment, back up stateful components, disable removed components, triage workbench images.
    - date: Upgrade
      title: Switch channel and approve
      desc: support-required-upgrade-3.5, then JobSet, then stable-3.5. From here the only rollback is the backup.
    - date: After upgrade
      title: Verify, re-test, clean up
      desc: Clear the gates, get the Gateway programmed, migrate workbenches and Ray, and diff against the baseline.

faq:
  eyebrow: For readers
  title: Questions people actually ask
  items:
    - question: Does running rhai-cli lint stop me from upgrading too early?
      answer: No. The lint is advisory. The 3.5 operator holds the DSC at upgrade gates, but by then rollback is no longer supported. Clear the lint first.
    - question: Will my model endpoints change?
      answer: Only for models you convert from Serverless or ModelMesh. An ISVC that was already RawDeployment keeps its Route and URL. Dashboard and workbench URLs do change.
    - question: Why does every command show its expected output?
      answer: A command whose output nobody checks is a guess about the system's state. Comparing against the expected output turns "ran it" into "confirmed it".
