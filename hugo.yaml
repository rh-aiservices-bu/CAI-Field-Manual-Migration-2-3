title: CAI Field Manual
baseURL: https://rh-aiservices-bu.github.io/CAI-Field-Manual-Migration-2-3/
defaultContentLanguage: en
disableLanguages: [zh, fr]
enableGitInfo: true
enableRobotsTXT: true
enableEmoji: true
timeZone: UTC

languages:
  en:
    label: English
    locale: en-US
    weight: 1
    title: CAI Field Manual
    params:
      description: Documentation, updates, and manuals for your project.
  # Keep disabled languages declared so Hugo recognizes .zh.md and .fr.md as
  # translations instead of treating them as duplicate English pages.
  zh:
    label: 简体中文
    locale: zh-CN
    weight: 2
    title: CAI Field Manual
    hasCJKLanguage: true
  fr:
    label: Français
    locale: fr-FR
    weight: 3
    title: CAI Field Manual

markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
      wrapStandAloneImageWithinParagraph: false
  highlight:
    noClasses: false

services:
  googleAnalytics:
    ID: G-7ZXCS2MF1D

outputs:
  home: [HTML, RSS, markdown, LLMS]
  page: [HTML, markdown]
  # LLMSFULL is enabled per section in front matter: the theme emits it only
  # for a top-level section and warns for nested ones, so a site-wide section
  # output trips /field-manual/hello-world/. content/field-manual/_index.md
  # opts in; the chat page reads that bundle as its whole-manual context.
  section: [HTML, RSS, print, markdown]

params:
  # Red Hat CAI Team lockup (fedora + divider + wordmark); sized for the
  # 4.3:1 aspect in assets/scss/_styles_project.scss. Ink follows the site
  # theme toggle via the SVG's own prefers-color-scheme query.
  logo: icons/logo-rh-cai.svg
  github_repo: https://github.com/rh-aiservices-bu/CAI-Field-Manual-Migration-2-3
  github_branch: main
  offline_search: true
  copyright:
    authors: Project contributors
    from_year: 2026
  footer_center_info: ''
  ui:
    preset: paper
    preset_menu: [paper, slate, ink, terminal]
    # Wordmark follows each preset's UI face (var(--td-ui-font-family))
    # via the :root override in assets/scss/_styles_project.scss, so a
    # Slate/Ink/Terminal reader never sees a foreign face in the brand row.
    dark_mode: true
    section_index: cards
    blog_index: cards
    sidebar_menu_foldable: true
    # Left nav shows the whole site tree from Home: the three top-level
    # entries (field manual, chat, why this approach) each expand in place,
    # instead of the root switcher swapping one section's tree at a time.
    # Chat is currently hidden (draft: true on content/chat/_index.md until the
    # section is functional), so it does not appear in the tree for now.
    docs_sidebar_root: home
    sidebar_root_menu: false
    # Numbered workshop-chrome nav (B): CSS counters give the top level "N."
    # and its children "N.M", so icon rows are gone from the tree --
    # `all`/`groups` would paint marks next to the numbers; marks stay in
    # landing cards, page headers, and the navbar.
    sidebar_icon_policy: none
    docs_section: field-manual
    share: [claude, chatgpt, linkedin, email, copy]
    page_context_menu:
      assistant_links: true
  # Display options: the page-top selector (layouts/_partials/
  # td-variant-selector.html, called by the docs/baseof.html override)
  # persists these in localStorage and filters content blocks tagged with
  # the variant shortcode. Ordered slice: render order in the selector.
  # Every axis needs `neutral` (the show-all option id,
  # never hides and never hidden) and a `default` that is one of its option
  # ids. Block ids may list several options: {{< variant deploy gitops >}}.
  variants:
    # Deployment type: whether Argo CD (or another GitOps controller) owns the
    # OpenShift AI resources. All changes are made with the oc CLI either
    # way; GitOps-managed clusters need extra steps (pause the reconciler,
    # record changes for Git, hand back after the migration).
    - id: deploy
      label: Deployment type
      default: all
      neutral: all
      status:
        specific: '{value} steps'
        neutral: steps for every deployment type
      options:
        - { id: all, label: Show all }
        - { id: gitops, label: GitOps-managed }
        - { id: standard, label: Not GitOps-managed }
    # Air-gapped clusters carry extra mirror steps.
    - id: env
      label: Cluster network
      default: all
      neutral: all
      status:
        specific: '{value} cluster'
        neutral: connected and disconnected clusters
      options:
        - { id: all, label: Show all }
        - { id: connected, label: Connected }
        - { id: disconnected, label: Disconnected (air-gapped) }
    # The Kueue end state changes several pre- and post-upgrade steps.
    - id: kueue
      label: Kueue end state
      default: all
      neutral: all
      status:
        specific: 'Kueue {value}'
        neutral: both Kueue end states
      options:
        - { id: all, label: Show all }
        - { id: removed, label: Removed }
        - { id: unmanaged, label: Unmanaged (external RHBOK) }

# Site header navigation. oink renders .Site.Menus.main in the navbar center
# zone and the home mobile drawer; the entry's page supplies the icon, and
# llms.txt lists it under Site index. Chat is not functional yet, so it is
# hidden from the site: the menu entry below is commented out, the Chat card
# in data/home.yaml is commented out, and content/chat/_index.md carries
# draft: true. Field Manual stays reachable through the landing cards and
# the sidebar; re-enabling Chat means undoing those three toggles.
menus:
  # `main: []` stays: with the only entry commented out, a bare `main:` key
  # decodes as null and fails the config load. Put re-enabled entries under it.
  main: []
  # - identifier: chat
  #   name: Chat
  #   pageRef: /chat
  #   weight: 30

module:
  imports:
    - path: github.com/pgsty/oink
  hugoVersion:
    extended: true
    min: 0.168.0
