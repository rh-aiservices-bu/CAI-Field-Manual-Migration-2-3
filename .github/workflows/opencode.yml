# OpenCode agent: /opencode or /oc in an issue or PR comment starts an agent
# run on this repo's Actions runner (model: self-hosted GLM 5.3, opencode.json).
#
# Auth: OIDC + opencode GitHub App (no app = no token = run fails).
#   1. Install https://github.com/apps/opencode-agent on this repository.
#   2. Secrets (Settings -> Secrets and variables -> Actions):
#      - GLM_API_KEY   key for the self-hosted GLM endpoint
#      - GLM_BASE_URL  base URL, e.g. https://glm.internal.example.com/v1
#   Both feed opencode.json (provider "glm") via {env:...} substitution.
#
# Flow: comment "/opencode fix this" on an issue -> branch + PR (Closes #N).
#       comment "/oc <request>" on that PR -> commits land on the PR branch.
#       Merge stays human-only: branch protection on main.
#
# Session sharing is off (share: false): public repo otherwise publishes the
# transcript link to opencode.ai.

name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Only one agent run per issue/PR at a time; a new mention queues after the
# current run instead of racing it on the same branch.
concurrency:
  group: opencode-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          GLM_BASE_URL: ${{ secrets.GLM_BASE_URL }}
        with:
          model: glm/glm-5.3
          share: "false"
