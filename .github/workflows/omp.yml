name: omp

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: omp-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  omp-agent:
    # Only respond to explicit /omp mentions; ignore bots (including this
    # workflow's own comments) to prevent loops.
    if: >-
      github.event.sender.type != 'Bot' &&
      contains(github.event.comment.body, '/omp')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install omp (pinned v18.18.0)
        run: |
          curl -sL -o /usr/local/bin/omp \
            https://github.com/can1357/oh-my-pi/releases/download/v18.18.0/omp-linux-x64
          chmod +x /usr/local/bin/omp
          echo "ec271e0d7df4c0f57acb6a7a28f8585d46bd050bcef8494f6d33db8a6c0dfbba  /usr/local/bin/omp" | sha256sum -c -

      - name: Configure agent
        run: |
          mkdir -p "$RUNNER_TEMP/agent-home/agent"
          cat > "$RUNNER_TEMP/agent-home/agent/models.yml" <<EOF
            providers:
              agent:
                name: agent
                baseUrl: "${AGENT_BASE_URL}"
                api: openai-completions
                auth: apiKey
                apiKey: AGENT_API_KEY
                models:
                  - id: "${AGENT_MODEL}"
                    name: Agent Model
                    contextWindow: 1000000
                    maxTokens: 32000
          EOF
        env:
          AGENT_BASE_URL: ${{ vars.AGENT_BASE_URL }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
          AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}

      - name: Run omp on the comment
        id: run
        env:
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
          AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/agent-home/agent
          GH_TOKEN: ${{ github.token }}
        run: |
          COMMENT_BODY="$(gh api repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }} --jq .body)"
          PROMPT="$(printf 'Repository: %s\n%s is a comment on %s #%s.\nHandle this request as the repo agent. If you change files, commit them to a branch named omp/issue-%s and open a PR.\n\nOUTPUT CONTRACT: your final message is captured after all tool calls finish and is posted verbatim on GitHub as the answer to this request. Make it the human-readable report itself, in clean GitHub-Flavored Markdown: status, what changed (branch, PR number, files), verification you ran with results, and open questions. Never end with raw JSON, YAML, shell payloads, diffs or file dumps meant for a tool call; those belong inside tool calls, not in your reply. Do not wrap the whole reply in a code fence.\n\n<comment>\n%s\n</comment>\n' \
            "${{ github.repository }}" \
            "${{ github.event.sender.login }}" \
            "${{ github.event.issue.html_url }}" \
            "${{ github.event.issue.number }}" \
            "${{ github.event.issue.number }}" \
            "$COMMENT_BODY")"
          omp --model "agent/${AGENT_MODEL}" -p --no-lsp \
            "$PROMPT" > "$RUNNER_TEMP/omp-stdout.txt" 2> "$RUNNER_TEMP/omp-stderr.txt"; exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_ENV"
          echo '--- agent stdout (tail) ---'
          tail -c 8000 "$RUNNER_TEMP/omp-stdout.txt" || true
          echo '--- agent stderr (tail) ---'
          tail -c 4000 "$RUNNER_TEMP/omp-stderr.txt" || true
          exit $exit_code

      - name: Print omp stats
        if: always()
        env:
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/agent-home/agent
        run: omp stats -s || true

      - name: Prepare agent output
        if: always()
        run: |
          # omp prints its final message on stdout. If the agent ended its turn
          # with a machine payload (e.g. the JSON it piped into `gh pr create`),
          # unwrap the human-readable body field; if the payload has none, fence
          # it so it still renders readably instead of a wall of escaped text.
          BODY="$(tail -c 46000 "$RUNNER_TEMP/omp-stdout.txt" 2>/dev/null || true)"
          if printf '%s' "$BODY" | jq -e 'type == "object"' >/dev/null 2>&1; then
            UNWRAPPED="$(printf '%s' "$BODY" | jq -r '.body // empty' 2>/dev/null || true)"
            if [ -n "$UNWRAPPED" ]; then
              BODY="$UNWRAPPED"
            fi
          fi
          if printf '%s' "$BODY" | jq -e 'type == "object" or type == "array"' >/dev/null 2>&1; then
            BODY="$(printf 'The agent returned a raw JSON payload instead of a readable summary:\n\n```json\n%s\n```' "$BODY")"
          fi
          {
            echo 'OMP_BODY<<OMP_BODY_EOF'
            printf '%s' "$BODY"
            echo
            echo 'OMP_BODY_EOF'
          } >> "$GITHUB_ENV"

      - name: Report result
        if: always()
        env:
          AGENT_BODY: ${{ env.OMP_BODY }}
        run: |
          {
            echo '### omp run'
            echo
            echo "<details><summary>Agent output (exit ${{ env.exit_code }})</summary>"
            echo
            printf '%s\n' "$AGENT_BODY"
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Reply on the issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          AGENT_BODY: ${{ env.OMP_BODY }}
          EXIT_CODE: ${{ env.exit_code }}
        run: |
          if [ -n "$AGENT_BODY" ]; then
            gh api repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments \
              -f body="$(printf '**omp run** (exit %s)\n\n<details><summary>agent output</summary>\n\n%s\n\n</details>' "$EXIT_CODE" "$AGENT_BODY")"
          fi
